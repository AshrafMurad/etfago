name: Release checks
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: etfago
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: etfago_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etfago -d etfago_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://etfago:ci-test-password@localhost:5432/etfago_test
      AUTH_SECRET: ci-test-only-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      STORAGE_ROOT: ./storage/private-files
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:http
      - run: npm audit --omit=dev
      - run: docker build -t etfago-release-check .
