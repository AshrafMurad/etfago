services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set the public HTTPS APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-etfago}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-etfago}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_URL: ${APP_URL:?Set APP_URL}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      STORAGE_ROOT: /data/etfago/private-files
      MAX_UPLOAD_BYTES: 10485760
      MAX_WORKSPACE_STORAGE_BYTES: 209715200
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Private persistent Docker volume on the server filesystem (NO S3)
      - private_files:/data/etfago/private-files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  migrate:
    build: .
    restart: "no"
    command: ["npm", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-etfago}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-etfago}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etfago}
      POSTGRES_USER: ${POSTGRES_USER:-etfago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etfago} -d ${POSTGRES_DB:-etfago}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  production_pgdata:
  private_files:
