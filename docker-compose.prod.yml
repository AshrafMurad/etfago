services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etfago-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${APP_URL}
      STORAGE_ROOT: /data/etfago/private-files
      MAX_UPLOAD_BYTES: 10485760
      MAX_WORKSPACE_STORAGE_BYTES: 209715200
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Private server filesystem mount for persistent attachment bytes (NO S3)
      - /srv/etfago/private-files:/data/etfago/private-files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: etfago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etfago}
      POSTGRES_USER: ${POSTGRES_USER:-etfago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - etfago_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etfago} -d ${POSTGRES_DB:-etfago}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  etfago_pgdata:
    name: etfago_pgdata
